apiVersion: v1
kind: Service
metadata:
  name: pong-service
  namespace: pingpong
spec:
  selector:
    app: pong-service
  ports:
    - port: 8033
      targetPort: 8033
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-service
  namespace: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pong-service
  template:
    metadata:
      labels:
        app: pong-service
    spec:
      containers:
        - name: pong-service
          image: pong-service:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8033
          env:
            - name: SERVER_PORT
              value: "8033"
          readinessProbe:
            tcpSocket:
              port: 8033
            initialDelaySeconds: 15
            periodSeconds: 5
