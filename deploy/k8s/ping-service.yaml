apiVersion: v1
kind: Service
metadata:
  name: ping-1
  namespace: pingpong
spec:
  selector:
    app: ping-1
  ports:
    - port: 8011
      targetPort: 8011
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-1
  namespace: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-1
  template:
    metadata:
      labels:
        app: ping-1
    spec:
      containers:
        - name: ping-service
          image: ping-service:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8011
          env:
            - name: SERVER_PORT
              value: "8011"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: PING_INSTANCE_ID
              value: ping-1
            - name: PONG_URL
              value: http://pong-service:8033
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: pingpong
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: mysecretpassword
          readinessProbe:
            tcpSocket:
              port: 8011
            initialDelaySeconds: 15
            periodSeconds: 5
---
