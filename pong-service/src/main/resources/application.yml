server:
  port: 8033

spring:
  application:
    name: pong-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.hsbc.pingpong.common.event"
        spring.json.value.default.type: "com.hsbc.pingpong.common.event.PingPongEvent"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pingpong}
    username: ${POSTGRES_USER:appuser}
    password: ${POSTGRES_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

hsbc:
  pingpong:
    max-requests-per-second: 1
    kafka:
      enabled: true
      topic: ping-pong-events
      group-id: pong-service
      max-retries: 3
      retry-backoff-ms: 1000
      dlt-topic: ping-pong-events-dlt

logging:
  level:
    com.hsbc.pingpong: INFO
